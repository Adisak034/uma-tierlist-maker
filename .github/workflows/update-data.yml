name: Auto-Update Uma Data from Umapyoi.net

on:
  schedule:
    # Runs every Monday at 00:00 UTC (07:00 AM Thailand time)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger via button on GitHub website

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch latest data from Umapyoi.net API
        run: node fetch_data.js

      - name: Commit and push if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new characters or cards found. Everything is up to date."
          else
            git commit -m "chore: update Uma Musume data from umapyoi.net [skip ci]"
            git push
            echo "Pushed updated data to repository!"
          fi
